{% extends 'portfolio/base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-label">// acesso</div>
        <div class="page-title">Criar Conta</div>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Registar</button>
            <a href="{% url 'login' %}" class="btn btn-ghost">Já tenho conta</a>
        </div>
    </form>
</div>
{% endblock %}
